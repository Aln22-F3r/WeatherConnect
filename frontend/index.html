<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherConnect - Mapa</title>

    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

</head>

<body>

    <header>
        <h1>WeatherConnect</h1>
        <p>Haz clic en el mapa para obtener latitud, longitud y clima</p>
    </header>

    <main>
        <div id="info">Selecciona un punto en el mapa</div>
        <div id="map"></div>
        <button id="getWeatherBtn">Obtener clima</button>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/map.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>

</body>

</html>
